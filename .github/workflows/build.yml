name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name FlowclientLauncher --collect-all customtkinter --collect-submodules minecraft_launcher_lib main.py
      - uses: actions/upload-artifact@v4
        with:
          name: FlowclientLauncher
          path: dist/FlowclientLauncher.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FlowclientLauncher.exe
